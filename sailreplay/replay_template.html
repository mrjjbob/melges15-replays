<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: chart-plotter screen. Map fills the left, live fleet cards on the right, transport bar along the bottom; Debrief tab swaps the map for tables and charts. Single dark look on purpose (TV in a dim bar). */
:root {
  --water: #0d1e29;
  --water-2: #122a39;
  --panel: #091620;
  --panel-2: #0f2230;
  --ink: #e4eef3;
  --muted: #86a1b0;
  --rule: #213c4c;
  --accent: #f2b33d;
  --ok: #5fc37a;
  --bad: #ff6461;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--panel); color: var(--ink); font: 15px/1.45 var(--f-body); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

/* header */
.top { display: flex; align-items: center; gap: 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--rule); background: var(--panel); flex-wrap: wrap; }
.title { display: flex; flex-direction: column; min-width: 0; }
.top .logo { display: block; flex: none; }
.top .logo img { display: block; height: 46px; width: auto; }
.title .home { font: 600 12px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-decoration: none; margin-bottom: 4px; }
.title .home:hover { color: var(--ink); }
.title h1 { margin: 0; font: 600 26px/1 var(--f-display); letter-spacing: .01em; text-wrap: balance; }
.title .sub { color: var(--muted); font-size: 13px; }
.clock { margin-left: auto; display: flex; align-items: baseline; gap: 10px; }
.clock .lbl { font: 600 12px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.clock .val { font: 700 40px/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--accent); min-width: 4.2ch; text-align: right; }
.races { display: flex; gap: 4px; flex-wrap: wrap; }
.races button { border: 1px solid var(--rule); background: var(--panel-2); color: var(--muted); border-radius: 8px; min-width: 40px; padding: 6px 10px; font: 600 15px/1 var(--f-display); letter-spacing: .04em; cursor: pointer; font-variant-numeric: tabular-nums; }
.races .dgrp { display: flex; gap: 4px; align-items: center; flex: none; }
.races .dgrp + .dgrp { margin-left: 8px; padding-left: 10px; border-left: 1px solid var(--rule); }
.races .dlbl { font: 600 11px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 2px; white-space: nowrap; }
.races button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #1a1205; }
.tabs { display: flex; gap: 4px; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 8px; padding: 3px; }
.tabs button { background: none; border: 0; padding: 6px 14px; border-radius: 6px; font: 600 15px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--water-2); color: var(--ink); }

/* replay view */
.view { min-height: 0; }
.replay { display: grid; grid-template-columns: 1fr 340px; height: 100%; min-height: 0; }
.mapwrap { position: relative; background: var(--water); min-height: 0; overflow: hidden; touch-action: none; }
canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
canvas#map.drag { cursor: grabbing; }
.windbox { position: absolute; top: 14px; right: 14px; background: rgba(9,22,32,.82); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: auto auto auto; gap: 4px 14px; align-items: center; }
.windbox canvas { grid-row: span 1; }
.windbox .col { display: grid; gap: 4px; }
.windbox .sh { font: 700 34px/0.9 var(--f-display); font-variant-numeric: tabular-nums; color: var(--muted); min-width: 3.2ch; }
.windbox .sh.right { color: var(--ok); }
.windbox .sh.left { color: var(--bad); }
.windbox .shc { font: 600 10.5px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.windbox .k { font: 600 11px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.windbox .v { font: 700 26px/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--accent); }
.windbox .src { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; max-width: 30ch; line-height: 1.35; }
.windbox .tide { grid-column: 1 / -1; border-top: 1px solid var(--rule); padding-top: 7px; margin-top: 2px; font-size: 12.5px; line-height: 1.35; color: var(--muted); max-width: 30ch; }
.windbox .tide { display: flex; align-items: center; gap: 10px; }
.windbox .tide b { font: 700 15px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.windbox .tide .bars { display: inline-flex; align-items: flex-end; gap: 3px; }
.windbox .tide .bars i { width: 5px; border-radius: 1px; background: var(--rule); }
.windbox .tide .bars i.on { background: #6fb7d9; }
.windbox .k .avg { letter-spacing: .06em; color: var(--ink); opacity: .75; margin-left: 4px; }
.maptools { position: absolute; left: 14px; top: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: rgba(9,22,32,.82); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 11px; font: 600 13px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--muted); }

.fleet { background: var(--panel); border-left: 1px solid var(--rule); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.fleet .hd { display: flex; justify-content: space-between; font: 600 12px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 4px 4px 2px; }
.boat { display: grid; grid-template-columns: 26px 1fr auto auto; gap: 4px 10px; align-items: center; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100%; }
.boat[aria-pressed="true"] { border-color: var(--bc); box-shadow: inset 3px 0 0 var(--bc); }
.boat .pos { font: 700 24px/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--muted); text-align: center; }
.boat .nm { font: 600 19px/1.1 var(--f-display); display: flex; align-items: center; gap: 8px; min-width: 0; }
.boat .nm i { width: 10px; height: 10px; border-radius: 50%; background: var(--bc); flex: none; }
.boat .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.boat .gap { font: 500 13px/1 var(--f-data); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.boat .stats { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.stat .v.fast { color: var(--ok); }
.stat .v.slow { color: var(--bad); }
.stat .k { font: 600 10.5px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stat .v { font: 600 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat .v small { font: 500 12px var(--f-body); color: var(--muted); margin-left: 1px; }
.mode { font: 600 11px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; padding: 3px 7px; border-radius: 4px; border: 1px solid var(--rule); color: var(--muted); }
.mode.up { color: #9fd4ff; border-color: #2d5a78; }
.mode.down { color: #ffd38a; border-color: #6b5224; }
.mode.fin { color: var(--ok); border-color: #2c5a3a; }
.mode.ocs { color: var(--bad); border-color: #6b2a2a; }
/* a boat sorting out a penalty (going back to the start, or doing turns) */
.boat.pen { border-color: #8a3434; background: linear-gradient(0deg, rgba(232,93,93,.13), rgba(232,93,93,.13)), var(--panel-2); }
.boat.pen .nm span { color: var(--bad); }
.mode.pen { color: #fff; background: #b23c3c; border-color: #b23c3c; }
td .pen { font: 600 10px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--bad); margin-left: 6px; }

/* transport */
.transport { display: grid; grid-template-columns: auto auto 1fr auto; gap: 14px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--rule); background: var(--panel); }
.play { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent); color: #1a1205; cursor: pointer; display: grid; place-items: center; }
.play svg { width: 20px; height: 20px; fill: currentColor; }
.speeds { display: flex; gap: 2px; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 8px; padding: 3px; }
.speeds button { border: 0; background: none; padding: 6px 9px; border-radius: 6px; font: 600 15px/1 var(--f-data); color: var(--muted); cursor: pointer; }
.speeds button[aria-pressed="true"] { background: var(--water-2); color: var(--ink); }
.scrub { position: relative; height: 44px; min-width: 0; }
.scrub canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
.tread { font: 500 14px/1.2 var(--f-data); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* debrief */
.debrief { height: 100%; overflow-y: auto; background: var(--panel); }
.debrief .inner { max-width: 1180px; margin: 0 auto; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
.debrief .inner > * { min-width: 0; }
.debrief h2 { margin: 0 0 10px; font: 600 24px/1.1 var(--f-display); letter-spacing: .02em; }
.debrief p.note { margin: 0 0 10px; color: var(--muted); max-width: 70ch; }
.debrief td.cmoved, .debrief td.cmoved b { color: var(--accent); }
.debrief td.ctype { color: #ff6fae; }
.debrief td.ctype b { color: #12202b; background: #ff6fae; padding: 1px 5px; border-radius: 4px; }
.debrief td .gt { color: var(--muted); }
.debrief .fold { cursor: pointer; user-select: none; }
.debrief .fold .more { display: inline-block; width: 18px; height: 18px; margin-left: 8px; vertical-align: 2px; border: 1px solid var(--rule); border-radius: 50%; position: relative; opacity: .7; }
.debrief .fold .more::after { content: "i"; position: absolute; inset: 0; display: grid; place-items: center; font: 600 11px/1 var(--f-body); color: var(--muted); }
.debrief .fold:hover .more, .debrief .fold[aria-expanded="true"] .more { opacity: 1; border-color: var(--accent); }
.debrief .fold[aria-expanded="true"] .more::after { color: var(--accent); }
.debrief .fold:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
th { font: 600 12px/1.2 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--panel-2); position: sticky; top: 0; }
td { font: 400 14px/1.2 var(--f-data); }
th:first-child, td:first-child { text-align: left; font-family: var(--f-body); font-weight: 600; }
td.nm i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
tr:last-child td { border-bottom: 0; }
tr.jump { cursor: pointer; }
table.wind td:last-child, table.wind th:last-child { text-align: left; font-family: var(--f-body); white-space: normal; }
tr.jump:hover td, tr.jumprace:hover td { background: var(--water-2); }
tr.jumprace { cursor: pointer; }
tr.jumprace.here td { background: var(--water-2); }
tr.jumprace .flag { color: var(--accent); }
.best { color: var(--ok); }
.flag { color: var(--bad); font-weight: 500; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.chartcard { border: 1px solid var(--rule); border-radius: 10px; padding: 14px; background: var(--panel-2); min-width: 0; }
.chartcard h3 { margin: 0 0 2px; font: 600 18px/1.2 var(--f-display); }
.chartcard .note { font-size: 13px; }
.chartcard canvas { width: 100%; height: 260px; display: block; }
.chartcard.wide { grid-column: 1 / -1; }
.chartcard canvas.tall { height: 520px; }
.advbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; }
.advplay { display: flex; gap: 12px; align-items: center; margin: 10px 0 0; }
.ovwrap { position: relative; }
.ovtools { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-start; max-width: calc(100% - 20px); }
.ovtools.r { left: auto; right: 10px; justify-content: flex-end; }
.advplay input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.advplay .t { font: 500 13px/1 var(--f-data); color: var(--muted); min-width: 120px; text-align: right; }
.advbar .k { font: 600 12px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); min-width: 64px; }
.advbar .chip { background: var(--panel-2); }
.advbar .dk { font: 600 11px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: 6px; }
.advbar .chip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
#advRoundTbl td.nm i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
select { background: var(--panel-2); border: 1px solid var(--rule); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .replay { grid-template-columns: 1fr; height: auto; }
  .mapwrap { height: 62vh; min-height: 320px; }
  .fleet { border-left: 0; border-top: 1px solid var(--rule); }
  .transport { grid-template-columns: auto 1fr; position: sticky; bottom: 0; }
  .transport .scrub { grid-column: 1 / -1; order: 3; }
  .transport .tread { order: 2; }
  .clock .val { font-size: 30px; }
  .windbox { top: auto; bottom: 46px; right: 10px; padding: 8px 10px; }
  .windbox .src { display: none; }
  .windbox .tide { padding-top: 5px; font-size: 11.5px; }
  .windbox .tide b { font-size: 13px; }
  .windbox .v { font-size: 22px; }
  .maptools { right: 10px; }
  .charts { grid-template-columns: 1fr; }
  .debrief { height: auto; }
  /* header stays pinned on phones, same on Replay and Debrief */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding-block: 8px;
         display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "title clock" "tabs tabs" "races races"; gap: 8px 10px; }
  .tabs button { flex: 1; }
  .top .logo { display: none; }
  .title { grid-area: title; min-width: 0; }
  .clock { grid-area: clock; margin-left: 0; align-self: center; }
  .races { grid-area: races; min-width: 0; }
  .tabs { grid-area: tabs; }
  .title h1 { font-size: 22px; }
  .title .sub { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clock .lbl { font-size: 10.5px; }
  .races { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .races button { min-width: 38px; padding: 7px 8px; }
  .tabs button { padding: 7px 10px; }
  .debrief .inner { padding-block: 16px 40px; gap: 22px; }
  .debrief h2 { font-size: 21px; }
  th, td { padding: 8px 10px; }
  td { font-size: 13px; }
  th:first-child, td:first-child { position: sticky; left: 0; background: var(--panel); z-index: 1; }
  th:first-child { background: var(--panel-2); }
  .chartcard canvas { height: 220px; }
  .chartcard canvas.tall { height: 380px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="title"><a class="home" id="home" href="../index.html" hidden>← All days</a><h1 id="title"></h1><div class="sub" id="sub"></div></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-replay" aria-selected="true">Replay</button>
      <button role="tab" id="tab-debrief" aria-selected="false">Debrief</button>
      <button role="tab" id="tab-advanced" aria-selected="false">Advanced</button>
    </div>
    <nav class="races" id="races" aria-label="Races" hidden></nav>
    <div class="clock"><span class="lbl" id="clockLbl">Race time</span><span class="val" id="clock">0:00</span></div>
  </header>

  <main class="view">
    <section class="replay" id="view-replay">
      <div class="mapwrap" id="mapwrap">
        <canvas id="map" aria-label="Race map"></canvas>
        <div class="maptools">
          <button class="chip" id="trail" aria-pressed="true">Trail 2 min</button>
          <button class="chip" id="paceBtn" aria-pressed="true">Pace width</button>
          <button class="chip" id="orient" aria-pressed="true">Wind up</button>
          <button class="chip" id="fit" aria-pressed="false">Fit fleet</button>
          <button class="chip" id="loop" aria-pressed="false">Loop</button>
          <button class="chip" id="cycle" aria-pressed="false">Cycle races</button>
          <button class="chip" id="full" aria-pressed="false">Full screen</button>
        </div>
        <div class="windbox" id="windbox">
          <canvas id="windArrow" width="56" height="56" aria-hidden="true"></canvas>
          <div class="col"><span class="k">Wind from</span><span class="v" id="twd">—</span><span class="shc" id="tws"></span></div>
          <div class="col"><span class="k">Shift <span class="avg" id="avg"></span></span><span class="sh" id="shift">—</span><span class="shc" id="shiftc"></span></div>
          <span class="tide" id="tide" hidden></span>
        </div>
      </div>
      <aside class="fleet" id="fleet"><div class="hd"><span>Fleet</span><span id="rankBy">Made good</span></div></aside>
    </section>
    <section class="debrief" id="view-debrief" hidden><div class="inner" id="debrief"></div></section>
    <section class="debrief" id="view-advanced" hidden><div class="inner" id="advanced"></div></section>
  </main>

  <footer class="transport">
    <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 20 20" id="playIcon"><path d="M5 3l12 7-12 7z"/></svg></button>
    <div class="speeds" id="speeds"></div>
    <div class="scrub" id="scrubwrap"><canvas id="scrub" aria-label="Timeline"></canvas></div>
    <div class="tread" id="tread"></div>
  </footer>
</div>

<script type="application/json" id="race-data">__RACE_JSON__</script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById("race-data").textContent);
const RACES = DATA.races || [DATA];
const DAY = DATA.day || null;
const APP = document.querySelector(".app"), APP_HTML = APP.innerHTML;
let ctl = null, cur = null;
// settings that carry from race to race (cycling rebuilds the page for each race)
const SESSION = { cycle: false, autoplay: false, speed: 10, trail: 120, trailMode: "pace", loop: false, orient: "wind", notes: new Set() };
function parseHash() {
  const h = location.hash.slice(1), m = /^r(\d+)(?:-(debrief|advanced))?$/.exec(h);
  if (m) return { k: Math.min(RACES.length - 1, Math.max(0, +m[1] - 1)), view: m[2] || "replay" };
  return { k: cur ? cur.k : 0, view: h === "debrief" || h === "advanced" ? h : "replay" };
}
function route() {
  const { k, view } = parseHash();
  if (cur && cur.k === k) { cur.api.show(view); return; }
  // switching races inside the debrief keeps your place, so one chart can be compared race to race
  const deb = document.querySelector(".debrief");
  const keep = view !== "replay" && deb && !deb.hidden ? { win: window.scrollY, el: deb.scrollTop } : null;
  if (ctl) ctl.abort();
  APP.innerHTML = APP_HTML;
  ctl = new AbortController();
  cur = { k, api: run(RACES[k], k, ctl.signal, view) };
  if (keep) {
    const put = () => { window.scrollTo(0, keep.win); const d = document.querySelector(".debrief"); if (d) d.scrollTop = keep.el; };
    put(); requestAnimationFrame(put);
  }
}
window.addEventListener("hashchange", route);
route();

function run(R, K, SIG, VIEW) {
const ON = { signal: SIG };
const hashFor = v => "r" + (K + 1) + (v === "debrief" || v === "advanced" ? "-" + v : "");
const M = R.meta, HZ = M.hz, N = M.n, GUN = M.gun_s;
const boats = R.boats;
const $ = id => document.getElementById(id);
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

      const at = Math.abs(B.twa[i]); if (!isFinite(at) || !isFinite(B.sog[i])) continue;
      if (at < 70 || at > 110) { let hs = 0, vs = 0, nn = 0; for (let q = i - half; q <= i + half; q++) if (q >= 0 && q < B.n && isFinite(B.heel[q]) && isFinite(B.vmg[q])) { hs += B.heel[q]; vs += B.vmg[q]; nn++; }
        if (!nn || !isFinite(B.heel[i])) continue;
        let v = vs / nn;
        if (at > 110) { const k = Math.min(14, Math.floor((at - 110) / 5)); if (!ref || ref.c[k] < 4 * P.hz) continue; v = v - ref.s[k] / ref.c[k] + ref.S / ref.C; }
        const bj = Math.floor(B.heel[i] - HEEL0), tgt = at < 70 ? b : d; if (bj >= 0 && bj < NH) { tgt.s[bj] += v; tgt.c[bj]++; } }
    }

  });
  // minS: fewest seconds for a point; solidS: seconds for it to count as solid
  // per boat: average VMG in each band, and the seconds spent there (what the brightness shows)
  const binSeries = (mp, xOf, minS) => [...mp].map(([name, a]) => { const hz = a.hz || 2;
    return { name, color: a.color, x: [...a.s].map((_, j) => xOf(j)),
      y: [...a.s].map((v, j) => a.c[j] >= minS * hz ? v / a.c[j] : NaN), sec: [...a.c].map(c => c / hz) }; });

  // minutes counts nearly at face value.

    // the line goes at that range's time-weighted middle

  // Brightness and dot size show time in each band, against that boat's busiest band; under 6 s the dot is hollow
  const scatter = (id, ser, xl, yl, empty, ideal) => { const [cv, c, w, h] = chartCanvas(id); const ys = ser.flatMap(s => s.y).filter(isFinite);
    if (!ys.length) { c.fillStyle = C.muted; c.font = "500 13px " + cssv("--f-body"); c.fillText(empty, 50, 40); return; }
    const xsF = ser.flatMap(s => s.x.filter((_, j) => isFinite(s.y[j]))); const x0 = Math.min(...xsF) - 1, x1 = Math.max(...xsF) + 1;
    const y0 = Math.floor(Math.min(...ys) * 2) / 2 - 0.2, y1 = Math.ceil(Math.max(...ys) * 2) / 2 + 0.2;
    const [X, Y, , Bm, Tp] = axes(c, w, h, x0, x1, y0, y1, xl, yl);
    if (ideal && ideal.flat) { c.fillStyle = C.muted; c.font = "600 12px " + cssv("--f-data"); c.textAlign = "right";
      c.fillText(`no clear best heel: every band within ${(ideal.gain * 100).toFixed(1)}% of the best`, w - 10, Tp + 26); c.textAlign = "left"; }
    else if (ideal && ideal.heel >= x0 && ideal.heel <= x1) { c.save();
      if (ideal.hi - ideal.lo > 1) { c.fillStyle = GOLD; c.globalAlpha = 0.08; c.fillRect(X(Math.max(x0, ideal.lo)), Tp, X(Math.min(x1, ideal.hi)) - X(Math.max(x0, ideal.lo)), h - Bm - Tp); }
      c.strokeStyle = GOLD; c.globalAlpha = 0.8; c.lineWidth = 1.5; c.setLineDash([5, 4]);
      c.beginPath(); c.moveTo(X(ideal.heel), Tp); c.lineTo(X(ideal.heel), h - Bm); c.stroke(); c.restore();
      c.fillStyle = GOLD; c.font = "600 12px " + cssv("--f-data"); const right = X(ideal.heel) > w * 0.62; c.textAlign = right ? "right" : "left";
      const rng = ideal.hi - ideal.lo > 1 ? ` (${Math.round(ideal.lo)}–${Math.round(ideal.hi)}°)` : "";
      c.fillText(`ideal ≈ ${Math.round(ideal.heel)}°${rng}`, X(ideal.heel) + (right ? -6 : 6), Tp + 12);
      c.font = "500 11px " + cssv("--f-data"); c.fillText(`${fmtClock(Math.round(ideal.sec))} of sailing`, X(ideal.heel) + (right ? -6 : 6), Tp + 27); c.textAlign = "left"; }
    for (const s of ser) {
      const top = Math.max(...s.sec.filter((_, j) => isFinite(s.y[j])), 1);
      const lv = j => Math.sqrt(Math.min(1, s.sec[j] / top));            // 0..1, square root so mid-range bands still show
      const al = j => 0.12 + 0.88 * lv(j);
      c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = 2;
      let pj = null;
      s.y.forEach((v, j) => { if (!isFinite(v)) { pj = null; return; }
        if (pj != null) { c.globalAlpha = Math.min(al(pj), al(j)); c.beginPath(); c.moveTo(X(s.x[pj]), Y(s.y[pj])); c.lineTo(X(s.x[j]), Y(v)); c.stroke(); }
        pj = j; });
      s.y.forEach((v, j) => { if (!isFinite(v)) return; c.globalAlpha = al(j); c.beginPath(); c.arc(X(s.x[j]), Y(v), 1.8 + 2.4 * lv(j), 0, 7);
        if (s.sec[j] >= 6) c.fill(); else { c.lineWidth = 1.2; c.stroke(); c.lineWidth = 2; } });
      c.globalAlpha = 1; } };
  scatter("advHeel", binSeries(hv, j => j + HEEL0 + 0.5, 2), "heel to leeward °", "VMG kt", "No steady upwind sailing in the races picked.", idealHeel(hv));
  scatter("advHeelDn", binSeries(hd, j => j + HEEL0 + 0.5, 2), "heel to leeward °", "VMG kt", "No steady downwind sailing in the races picked.", idealHeel(hd));
}
let ADVS = null;
function advStartUi() {
  const b = $("advStartPlay"), r = $("advStartT"), l = $("advStartLbl"); if (!b) return;
  b.textContent = ADV.playing ? "Pause" : "Play"; b.setAttribute("aria-pressed", String(ADV.playing));
  r.value = ADV.startT; l.textContent = ADV.startT === 0 ? "Gun" : fmtClock(Math.abs(ADV.startT)) + (ADV.startT < 0 ? " to the gun" : " after the gun");
}
function drawStarts() {
  if (!ADVS || !$("advStarts")) return;
  const t = ADV.startT, j = Math.round((t + 60) * 2), j0 = Math.max(0, j - 40);
  const paths = [];
  for (const p of ADVS.paths) paths.push({ color: p.color, pts: p.pts, alpha: 0.13, glyph: false });
  for (const p of ADVS.paths) { const seg = p.pts.slice(j0, j + 1); if (seg.length && isFinite(seg[seg.length - 1][0])) paths.push({ color: p.color, pts: seg, alpha: 0.95 }); }
  const lines = ADVS.lines;
  advOverlay("advStarts", paths, { up: ADV.startOrient === "wind" ? "wind" : "course", extent: lines.flat(), empty: "No starts in the races picked.",
    under: (c, sx, sy) => { c.setLineDash([5, 5]); c.strokeStyle = t >= 0 ? "rgba(242,179,61,.85)" : "rgba(242,179,61,.5)"; c.lineWidth = t >= 0 ? 1.6 : 1.2;
      for (const [a, b] of lines) { c.beginPath(); c.moveTo(sx(a[0]), sy(a[1])); c.lineTo(sx(b[0]), sy(b[1])); c.stroke(); c.fillStyle = "rgba(242,179,61,.8)"; for (const p of [a, b]) { c.beginPath(); c.arc(sx(p[0]), sy(p[1]), 2.5, 0, 7); c.fill(); } }
      c.setLineDash([]); },
    over: c => { c.font = "600 26px " + cssv("--f-display"); c.fillStyle = t < 0 ? C.ink : C.accent; c.textAlign = "left";
      c.fillText(t === 0 ? "GUN" : (t < 0 ? "−" : "+") + fmtClock(Math.abs(t)), 12, 32); } });
}
function advStartLoop() {

// ---------- boot
const ro = new ResizeObserver(() => { if (SIG.aborted) return; if (!$("view-replay").hidden) resize(); else { sizeScrub(); drawScrub(); } });
ro.observe($("mapwrap")); ro.observe($("scrubwrap"));

show(VIEW);
resize(); refresh();
if (SESSION.cycle && SESSION.autoplay && VIEW !== "debrief") setTimeout(() => { if (!SIG.aborted) setPlaying(true); }, 600);

}
})();
